name: Sensus Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SMOOTH_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shell-release.jks"

      - name: Build signed APK
        env:
          SMOOTH_SIGNING_STORE_PASSWORD: ${{ secrets.SMOOTH_SIGNING_STORE_PASSWORD }}
          SMOOTH_SIGNING_KEY_PASSWORD: ${{ secrets.SMOOTH_SIGNING_KEY_PASSWORD }}
          SMOOTH_SIGNING_KEY_ALIAS: smooth-shell
        run: |
          set -euo pipefail
          test -n "$SMOOTH_SIGNING_STORE_PASSWORD"
          test -n "$SMOOTH_SIGNING_KEY_PASSWORD"
          export SMOOTH_SIGNING_STORE_FILE="$RUNNER_TEMP/shell-release.jks"
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="aae94f1d5de956e242ddfe7515ae8684600fc47c772bb4b3fb97d31c54f9d93c"
          test "$ACTUAL" = "$EXPECTED"

      - name: Privacy check
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          FORBIDDEN_A="$(printf '\141\154\164\145\153')"
          FORBIDDEN_B="$(printf '\141\154\153\141\156\141\164')"
          PATTERN="${FORBIDDEN_A}|${FORBIDDEN_B}"
          if unzip -Z1 "$APK" | grep -Ei "$PATTERN"; then
            exit 1
          fi
          if unzip -p "$APK" | grep -aEi "$PATTERN"; then
            exit 1
          fi

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Smooth-Sensus-v0.0.6.apk
          cd dist
          sha256sum Smooth-Sensus-v0.0.6.apk > Smooth-Sensus-v0.0.6.apk.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smooth-sensus-v0.0.6-signed
          path: dist/*
          if-no-files-found: error
          retention-days: 30